name: Generate Index and Deploy
on:
  push:
    branches:
      - main # Or your default branch
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create index.html
        id: create-index
        run: |
          echo "<!DOCTYPE html>" > index.html
          echo "<html lang=\"en\">" >> index.html
          echo "<head>" >> index.html
          echo "  <meta charset=\"UTF-8\">" >> index.html
          echo "  <title>Repository Index</title>" >> index.html
          echo "  <style>" >> index.html
          echo "    body { font-family: sans-serif; }" >> index.html
          echo "    h1 { color: #333; }" >> index.html
          echo "  </style>" >> index.html
          echo "</head>" >> index.html
          echo "<body>" >> index.html
          echo "  <h1>Repository Files</h1>" >> index.html
          echo "  <ul>" >> index.html
          find . -name "*" -not -name "index.html" | sort | while read filename; do
            filename=${filename#./} # Remove the leading './'
            echo "    <li><a href=\"${filename}\">${filename}</a></li>" >> index.html
          done
          echo "  </ul>" >> index.html
          echo "</body>" >> index.html
          echo "</html>" >> index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './' # Upload the entire root directory including the new index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

